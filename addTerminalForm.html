<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Location Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
  <!-- Button to open modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#terminalLocationModal">
    Add Terminal Location
  </button>
</div>

<!-- Modal -->
<div class="modal fade" id="terminalLocationModal" tabindex="-1" aria-labelledby="terminalLocationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <div class="modal-header">
        <h5 class="modal-title" id="terminalLocationModalLabel">Terminal Location Add Form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form action="/submit" method="POST">
        <div class="modal-body">
          <div class="mb-3">
            <label for="terminalName" class="form-label"><strong>Terminal Name</strong></label>
            <input type="text" class="form-control" id="terminalName" name="terminalName" required>
          </div>
          <div class="mb-3">
            <label for="town" class="form-label"><strong>Town</strong></label>
            <input type="text" class="form-control" id="town" name="town" required>
          </div>
          <div class="mb-3">
            <label for="coordinates" class="form-label"><strong>Coordinates</strong></label>
            <input type="text" class="form-control" id="coordinates" name="coordinates" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
