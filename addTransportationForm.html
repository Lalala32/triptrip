<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transportation Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
  <!-- Button to open modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#transportationModal">
    Add Transportation
  </button>
</div>

<!-- Modal -->
<div class="modal fade" id="transportationModal" tabindex="-1" aria-labelledby="transportationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <div class="modal-header">
        <h5 class="modal-title" id="transportationModalLabel">Transportation Type add form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form action="/submit" method="POST">
        <div class="modal-body">
          <div class="mb-3">
            <label for="transportation" class="form-label"><strong>Transportation</strong></label>
            <input type="text" class="form-control" id="transportation" name="transportation" required>
          </div>
          <div class="mb-3">
            <label for="transportationType" class="form-label"><strong>Transportation Type</strong></label>
            <input type="text" class="form-control" id="transportationType" name="transportationType" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS (with Popper for modals) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
