<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Fare Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#fareModal">
    Add Fare
  </button>
</div>

<!-- Modal -->
<div class="modal fade" id="fareModal" tabindex="-1" aria-labelledby="fareModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-4">
      <div class="modal-header pt-2 pb-1">
        <h5 class="modal-title" id="fareModalLabel">Fare add form</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form action="/submit-fare" method="POST">
        <div class="modal-body">
          <div class="mb-3">
            <label for="from" class="form-label"><strong>From:</strong></label>
            <select class="form-select" id="from" name="from" required>
              <option selected disabled>Select origin terminal</option>
              <option value="Terminal A">Terminal A</option>
              <option value="Terminal B">Terminal B</option>
              <option value="Terminal C">Terminal C</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="to" class="form-label"><strong>To:</strong></label>
            <select class="form-select" id="to" name="to" required>
              <option selected disabled>Select destination terminal</option>
              <option value="Terminal A">Terminal A</option>
              <option value="Terminal B">Terminal B</option>
              <option value="Terminal C">Terminal C</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="transportType" class="form-label"><strong>Transport Type</strong></label>
            <select class="form-select" id="transportType" name="transportType" required>
              <option selected disabled>Select transport type</option>
              <option value="Bus">Bus</option>
              <option value="Van">Van</option>
              <option value="Jeepney">Jeepney</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="terminalOptions" class="form-label"><strong>Terminal Options</strong></label>
            <input type="text" class="form-control" id="terminalOptions" name="terminalOptions" placeholder="Enter terminal options" required>
          </div>

          <div class="mb-3">
            <label for="category" class="form-label"><strong>Category</strong></label>
            <select class="form-select" id="category" name="category" required>
              <option selected disabled>Select category</option>
              <option value="Regular">Regular</option>
              <option value="Student">Student</option>
              <option value="Senior">Senior</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="fare" class="form-label"><strong>Estimated Fare</strong></label>
            <input type="number" step="1" class="form-control" id="fare" name="fare" placeholder="Enter fare" required>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
